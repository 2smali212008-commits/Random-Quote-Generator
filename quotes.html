<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <meta name="description" content="A fresh thought, a soft smile, and a little inspiration for your day.">
  <title>Your Daily Inspiration</title>
  <style>
    :root{--ink:#49384f;--muted:#80758a;--line:rgba(73,56,79,.13);--accent:#d66b91;--accent-dark:#ad4f75;--accent-soft:#ffe0eb;--page-a:#fff7fa;--page-b:#f8e9f0;--card-a:#fffafd;--card-b:#ffedf3;--spark:#f7b1c8;--character-hair:#71506a;--character-dress:#ee9bb7;--character-skin:#ffd9c8;--shadow:rgba(115,70,95,.16)}
    *{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;background:radial-gradient(ellipse at 12% 7%,var(--page-b),transparent 34%),radial-gradient(ellipse at 90% 92%,var(--accent-soft),transparent 36%),linear-gradient(135deg,var(--page-a),#fff 54%,var(--page-b));transition:background 900ms ease,color 500ms ease;overflow-x:hidden}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:min(1120px,calc(100% - 44px));margin:auto;position:relative;min-height:100vh;display:flex;flex-direction:column}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}.brand-icon{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);font-size:19px;transition:background .6s}.home{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:700;transition:color .2s}.home:hover{color:var(--accent-dark)}.home svg{width:16px}.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 0 42px}.heading{text-align:center;margin-bottom:27px}.eyebrow{color:var(--accent-dark);font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.heading h1{margin:9px 0 6px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,5vw,49px);letter-spacing:-1.5px}.heading p{margin:0;color:var(--muted);font-size:13px}.experience{display:grid;grid-template-columns:minmax(280px,.88fr) minmax(400px,1.12fr);align-items:center;gap:26px}.character-panel{min-height:430px;position:relative;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:linear-gradient(150deg,rgba(255,255,255,.7),rgba(255,255,255,.25));overflow:hidden;box-shadow:0 18px 50px var(--shadow);transition:background .7s,border-color .7s}.character-panel:before,.character-panel:after{content:"";position:absolute;border-radius:50%;background:var(--accent-soft);opacity:.7;transition:background .7s}.character-panel:before{width:260px;height:260px;top:-115px;right:-80px}.character-panel:after{width:200px;height:200px;bottom:-100px;left:-65px}.scene-glow{position:absolute;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);opacity:.9;transition:background .7s}.character-frame{position:relative;z-index:1;width:min(315px,82%);filter:drop-shadow(0 18px 18px rgba(72,50,85,.12));transition:opacity .24s,transform .55s}.character-frame.swap{opacity:.25;transform:translateY(8px) scale(.96)}.character-frame svg{display:block;width:100%;height:auto}.scene-emoji{position:absolute;z-index:2;display:grid;place-items:center;border:1px solid rgba(255,255,255,.85);border-radius:50%;background:rgba(255,255,255,.77);box-shadow:0 8px 22px var(--shadow);animation:float 4.5s ease-in-out infinite;transition:all .6s}.deco-one{width:46px;height:46px;left:10%;top:14%;font-size:21px}.deco-two{width:39px;height:39px;right:9%;top:25%;font-size:18px;animation-delay:-1.4s}.deco-three{width:47px;height:47px;right:11%;bottom:13%;font-size:22px;animation-delay:-2.5s}.deco-four{width:35px;height:35px;left:12%;bottom:20%;font-size:16px;animation-delay:-.7s}.scene-name{position:absolute;z-index:2;left:50%;bottom:15px;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.7);color:var(--accent-dark);font-size:10px;font-weight:800;white-space:nowrap;transition:color .5s}.quote-card{position:relative;padding:34px 34px 28px;border:1px solid rgba(255,255,255,.82);border-radius:28px;background:linear-gradient(145deg,var(--card-a),var(--card-b));box-shadow:0 22px 55px var(--shadow);transition:background .7s,border-color .7s,transform .25s,box-shadow .7s}.quote-card.changing{transform:translateY(5px);opacity:.65}.quote-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.theme-badge{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-dark);font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;transition:all .6s}.theme-emoji{font-size:15px}.quote-mark{color:var(--accent);font-family:Georgia,serif;font-size:56px;line-height:.7;opacity:.75;transition:color .6s}.quote-text{min-height:150px;display:flex;align-items:center;margin:14px 0;color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:clamp(23px,3vw,31px);line-height:1.47;letter-spacing:-.4px;transition:opacity .22s,transform .22s}.quote-text.fade{opacity:0;transform:translateY(6px)}.author-row{display:flex;align-items:flex-start;gap:11px;margin-top:6px}.author-line{width:25px;height:2px;flex:0 0 25px;margin-top:12px;border-radius:2px;background:var(--accent);transition:background .6s}.byline{display:flex;flex-direction:column;gap:4px}.author{color:var(--accent-dark);font-family:Georgia,"Times New Roman",serif;font-size:clamp(19px,2.3vw,24px);font-weight:800;line-height:1.2;transition:color .6s}.quote-source{color:var(--muted);font-size:11px;font-style:italic;line-height:1.4}.quote-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.btn{min-height:47px;padding:0 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--ink);font-size:12px;font-weight:800;cursor:pointer;transition:transform .18s,box-shadow .18s,background .5s,color .5s,border-color .5s}.btn:hover{transform:translateY(-2px)}.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.btn svg{width:16px;height:16px}.btn-new{flex:1;border:0;background:linear-gradient(105deg,var(--accent),var(--accent-dark));color:white;box-shadow:0 9px 22px var(--shadow)}.btn-new:hover{box-shadow:0 13px 27px var(--shadow);filter:saturate(1.08)}.btn-home:hover{border-color:var(--accent);color:var(--accent-dark)}.helper{text-align:center;margin:14px 0 0;color:var(--muted);font-size:10px}.decor{position:fixed;pointer-events:none;z-index:-1;color:var(--accent);opacity:.35;font-size:20px;transition:color .6s}.d1{left:3%;top:35%}.d2{right:4%;top:48%;font-size:14px}.d3{right:16%;bottom:5%;font-size:16px}.d4{left:18%;bottom:8%;font-size:13px}footer{height:48px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);color:var(--muted);font-size:10px}footer span:last-child{color:var(--accent-dark);transition:color .6s}
    body[data-theme="happiness"]{--page-a:#fff9fb;--page-b:#ffe5ee;--card-a:#fffafd;--card-b:#ffedf3;--accent:#e887a7;--accent-dark:#b65276;--accent-soft:#ffe0eb;--character-hair:#71506a;--character-dress:#ee9bb7;--character-skin:#ffd9c8;--shadow:rgba(155,78,111,.16)}
    body[data-theme="motivation"]{--page-a:#f3fbff;--page-b:#d8f1ff;--card-a:#fff;--card-b:#eaf8ff;--accent:#4e9fc7;--accent-dark:#31769b;--accent-soft:#d7f0ff;--character-hair:#5c557f;--character-dress:#75c4df;--character-skin:#ffd8c2;--shadow:rgba(56,124,161,.16)}
    body[data-theme="dreams"]{--page-a:#faf7ff;--page-b:#e8ddff;--card-a:#fff;--card-b:#f2ecff;--accent:#9270c5;--accent-dark:#70509e;--accent-soft:#e8ddff;--character-hair:#55486e;--character-dress:#b49ade;--character-skin:#ffd9ce;--shadow:rgba(105,76,153,.17)}
    body[data-theme="nature"]{--page-a:#f4fff8;--page-b:#dcf6e8;--card-a:#fff;--card-b:#ebfbf1;--accent:#55a77d;--accent-dark:#377c5b;--accent-soft:#d9f3e3;--character-hair:#554a59;--character-dress:#8ed1a8;--character-skin:#ffddc9;--shadow:rgba(58,132,91,.16)}
    body[data-theme="love"]{--page-a:#fff7fa;--page-b:#ffdfe9;--card-a:#fff;--card-b:#ffedf2;--accent:#e36e91;--accent-dark:#b9436c;--accent-soft:#ffdae6;--character-hair:#634466;--character-dress:#f18aab;--character-skin:#ffdac8;--shadow:rgba(174,65,104,.17)}
    body[data-theme="confidence"]{--page-a:#fffaf2;--page-b:#ffe9cb;--card-a:#fff;--card-b:#fff2dc;--accent:#db8b3c;--accent-dark:#a85d20;--accent-soft:#ffe5bf;--character-hair:#574353;--character-dress:#f4a755;--character-skin:#ffd8bd;--shadow:rgba(177,109,43,.17)}
    body[data-theme="peace"]{--page-a:#f5fbff;--page-b:#dceeff;--card-a:#fff;--card-b:#edf6ff;--accent:#6b9fc8;--accent-dark:#456f98;--accent-soft:#dfedff;--character-hair:#4d5873;--character-dress:#a6c9ec;--character-skin:#ffddcb;--shadow:rgba(70,119,166,.16)}
    body[data-theme="friendship"]{--page-a:#fffdf1;--page-b:#fff1bd;--card-a:#fff;--card-b:#fff8dc;--accent:#c49a36;--accent-dark:#92701d;--accent-soft:#fff0b8;--character-hair:#69503d;--character-dress:#f3d278;--character-skin:#ffddc8;--shadow:rgba(160,127,47,.17)}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
    @media(max-width:850px){.shell{width:min(650px,calc(100% - 36px))}.main{padding:27px 0 32px}.experience{grid-template-columns:1fr;gap:16px}.heading{margin-bottom:20px}.character-panel{min-height:330px;order:2}.quote-card{order:1}.character-frame{width:min(245px,65%)}.scene-glow{width:230px;height:230px}.deco-one{left:15%;top:12%}.deco-two{right:14%;top:18%}.deco-three{right:16%;bottom:14%}.deco-four{left:15%;bottom:18%}.scene-name{bottom:12px}}
    @media(max-width:520px){.shell{width:calc(100% - 26px)}.topbar{height:68px}.brand{font-size:14px}.brand-icon{width:33px;height:33px}.home{font-size:11px}.main{padding:24px 0 28px}.heading{margin-bottom:17px}.heading h1{font-size:36px}.quote-card{padding:25px 20px 21px;border-radius:22px}.quote-text{min-height:135px;font-size:24px}.quote-mark{font-size:46px}.quote-actions{margin-top:20px}.btn{min-height:45px;padding:0 13px}.character-panel{min-height:300px;border-radius:22px}.character-frame{width:min(225px,66%)}footer{height:44px;font-size:9px}.decor{font-size:14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
    .author-row {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  margin-top: 6px;
}

.author-line {
  width: 25px;
  height: 2px;
  flex: 0 0 25px;
  margin-top: 12px;
  border-radius: 2px;
  background: var(--accent);
}

.byline {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.author {
  color: var(--accent-dark);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 23px;
  font-weight: 800;
  line-height: 1.2;
}

.quote-source {
  color: var(--muted);
  font-size: 11px;
  font-style: italic;
}
  </style>
</head>
<body data-theme="happiness">
  <span class="decor d1" aria-hidden="true">✦</span><span class="decor d2" aria-hidden="true">✧</span><span class="decor d3" aria-hidden="true">♡</span><span class="decor d4" aria-hidden="true">✿</span>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-icon" aria-hidden="true">🌷</span><span>Daily Inspiration</span></a>
      <a class="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to Home</a>
    </header>
    <main class="main">
      <div class="heading"><div class="eyebrow">A gentle thought for today</div><h1>Your Daily Inspiration</h1><p>Take what you need for your day ✨</p></div>
      <section class="experience" aria-live="polite">
        <div class="character-panel">
          <div class="scene-glow" aria-hidden="true"></div>
          <span class="scene-emoji deco-one" id="decoOne" aria-hidden="true">🌸</span>
          <span class="scene-emoji deco-two" id="decoTwo" aria-hidden="true">✨</span>
          <span class="scene-emoji deco-three" id="decoThree" aria-hidden="true">💗</span>
          <span class="scene-emoji deco-four" id="decoFour" aria-hidden="true">🌼</span>
          <div class="character-frame" id="character"></div>
          <div class="scene-name" id="characterName">Mika · your happy-day friend</div>
        </div>
        <article class="quote-card" id="quoteCard">
          <div class="quote-top"><span class="theme-badge" id="themeBadge"><span class="theme-emoji" id="themeEmoji">🌸</span><span id="themeName">Happiness</span></span><span class="quote-mark" aria-hidden="true">“</span></div>
          <p class="quote-text" id="quoteText"></p>

          <div class="author-row">
  <span class="author-line" aria-hidden="true"></span>
  <div class="byline">
    <span class="author" id="quoteAuthor"></span>
    <span class="quote-source" id="quoteSource"></span>
  </div>



          <div class="quote-actions">
            <button class="btn btn-new" id="newQuote" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5m-4.2-3A8 8 0 0 1 18 6l2 2m-16 8 2 2a8 8 0 0 0 13.2-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>✨ New Quote</button>
            <a class="btn btn-home" href="index.html">⌂ Back to Home</a>
          </div>
          <p class="helper">A small reminder can make a lovely difference.</p>
        </article>
      </section>
    </main>
    <footer><span>© Daily Inspiration</span><span>Made with a little sunshine ♡</span></footer>
  </div>
  <script>
    const quoteList = [
      
  {
    text: "If one advances confidently in the direction of his dreams...",
    author: "Henry David Thoreau",
    source: "Walden",
    theme: "dreams"
  },
  {
    text: "Trust thyself: every heart vibrates to that iron string.",
    author: "Ralph Waldo Emerson",
    source: "Self-Reliance",
    theme: "confidence"
  },
  {
    text: "Be not afraid of greatness.",
    author: "William Shakespeare",
    source: "Twelfth Night",
    theme: "confidence"
  },
  {
    text: "I declare, after all, there is no enjoyment like reading!",
    author: "Jane Austen",
    source: "Pride and Prejudice",
    theme: "happiness"
  }
];    

    const themes = {
      happiness:{name:"Happiness",emoji:"🌸",character:"Mika · your happy-day friend",hair:"#71506a",dress:"#ee9bb7",skin:"#ffd9c8",decor:["🌸","✨","💗","🌼"]},
      motivation:{name:"Motivation",emoji:"✨",character:"Aoi · your brave little cheerleader",hair:"#5c557f",dress:"#75c4df",skin:"#ffd8c2",decor:["☁️","⭐","💧","🩵"]},
      dreams:{name:"Dreams",emoji:"🌙",character:"Luna · your moonlight dreamer",hair:"#55486e",dress:"#b49ade",skin:"#ffd9ce",decor:["🌙","✦","⭐","💜"]},
      nature:{name:"Nature",emoji:"🦋",character:"Hana · your garden-day friend",hair:"#554a59",dress:"#8ed1a8",skin:"#ffddc9",decor:["🍃","🦋","🌱","🌼"]},
      love:{name:"Love",emoji:"❤️",character:"Yuna · your heart-full friend",hair:"#634466",dress:"#f18aab",skin:"#ffdac8",decor:["💗","💕","🌹","✨"]},
      confidence:{name:"Confidence",emoji:"🔥",character:"Akari · your fearless friend",hair:"#574353",dress:"#f4a755",skin:"#ffd8bd",decor:["🔥","☀️","⭐","🧡"]},
      peace:{name:"Peace",emoji:"🕊️",character:"Sora · your peaceful-day friend",hair:"#4d5873",dress:"#a6c9ec",skin:"#ffddcb",decor:["🕊️","☁️","💧","🩵"]},
      friendship:{name:"Friendship",emoji:"🌻",character:"Nao · your sunny-side friend",hair:"#69503d",dress:"#f3d278",skin:"#ffddc8",decor:["🌻","💛","✨","🌼"]}
    };

    let previousQuote = -1;
    let currentTheme = "";
    const body = document.body;
    const quoteCard = document.getElementById("quoteCard");
    const quoteText = document.getElementById("quoteText");
    const characterFrame = document.getElementById("character");

    function characterSVG(theme) {
      return `<svg viewBox="0 0 320 340" role="img" aria-label="Cute anime-inspired illustration for ${theme.name}" xmlns="http://www.w3.org/2000/svg">
        <circle cx="160" cy="166" r="144" fill="${theme.dress}" opacity=".22"/>
        <circle cx="160" cy="166" r="120" fill="#fff" opacity=".35"/>
        <path d="M74 143c-7-72 28-111 86-111 67 0 97 48 87 122l-9 116c-2 19-16 32-36 32H117c-20 0-35-14-37-34z" fill="${theme.hair}"/>
        <path d="M121 218h78v56c0 23-78 23-78 0z" fill="${theme.skin}"/>
        <path d="M100 267c-48 13-67 37-80 73h280c-13-36-32-60-80-73l-60 31z" fill="${theme.dress}"/>
        <path d="m133 267 27 31 27-31-11-13h-32z" fill="#fff" opacity=".8"/>
        <ellipse cx="79" cy="151" rx="17" ry="24" fill="${theme.skin}"/><ellipse cx="241" cy="151" rx="17" ry="24" fill="${theme.skin}"/>
        <path d="M84 122c0-59 30-91 76-91s76 32 76 91v53c0 54-31 87-76 87s-76-33-76-87z" fill="${theme.skin}"/>
        <path d="M79 130C73 58 109 24 164 26c53 2 82 33 78 91-20-4-36-15-47-32-17 26-57 41-116 45z" fill="${theme.hair}"/>
        <path d="M101 77c15-28 38-40 63-42-13 20-17 39-14 55-17-7-32-10-49-9z" fill="#fff" opacity=".18"/>
        <path d="M91 131q26-24 52 0M178 131q26-24 52 0" fill="none" stroke="${theme.hair}" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="119" cy="151" rx="18" ry="22" fill="#fff"/><ellipse cx="201" cy="151" rx="18" ry="22" fill="#fff"/>
        <ellipse cx="122" cy="153" rx="10" ry="15" fill="#55476b"/><ellipse cx="198" cy="153" rx="10" ry="15" fill="#55476b"/>
        <circle cx="126" cy="146" r="5" fill="#fff"/><circle cx="202" cy="146" r="5" fill="#fff"/>
        <ellipse cx="103" cy="186" rx="18" ry="8" fill="#f184a2" opacity=".42"/><ellipse cx="217" cy="186" rx="18" ry="8" fill="#f184a2" opacity=".42"/>
        <path d="M145 201q15 18 30 0" fill="none" stroke="#b65f76" stroke-width="4" stroke-linecap="round"/>
        <path d="M160 188v6" stroke="#d59784" stroke-width="2" stroke-linecap="round"/>
        <path d="M132 298q28 26 56 0" fill="none" stroke="#fff" stroke-width="4" opacity=".65" stroke-linecap="round"/>
        <path d="M221 75c19-17 33-15 38-7-8 12-19 18-32 19 17 2 26 10 27 20-15 0-27-6-35-18z" fill="${theme.dress}" stroke="#fff" stroke-width="3"/>
        <g fill="#fff" opacity=".9"><path d="m51 86 4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="m271 230 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><circle cx="57" cy="230" r="4"/><circle cx="266" cy="90" r="3"/></g>
      </svg>`;
    }

    function showRandomQuote() {
      const candidates = quoteList
        .map((quote, index) => ({quote, index}))
        .filter(item => item.index !== previousQuote && item.quote.theme !== currentTheme);
      const pool = candidates.length ? candidates : quoteList.map((quote, index) => ({quote, index})).filter(item => item.index !== previousQuote);
      const selected = pool[Math.floor(Math.random() * pool.length)];
      const quote = selected.quote;
      const theme = themes[quote.theme];

      quoteCard.classList.add("changing");
      quoteText.classList.add("fade");
      characterFrame.classList.add("swap");

      window.setTimeout(() => {
        previousQuote = selected.index;
        currentTheme = quote.theme;
        body.dataset.theme = quote.theme;
        quoteText.textContent = `“${quote.text}”`;
        document.getElementById("quoteAuthor").textContent = `— ${quote.author}`;    
        document.getElementById("quoteSource").textContent = quote.source;
        document.getElementById("themeName").textContent = theme.name;
        document.getElementById("themeEmoji").textContent = theme.emoji;
        document.getElementById("characterName").textContent = theme.character;
        characterFrame.innerHTML = characterSVG(theme);
        theme.decor.forEach((emoji, index) => {
          document.getElementById(["decoOne", "decoTwo", "decoThree", "decoFour"][index]).textContent = emoji;
        });
        quoteCard.classList.remove("changing");
        quoteText.classList.remove("fade");
        characterFrame.classList.remove("swap");
      }, 220);
    }

    document.getElementById("newQuote").addEventListener("click", showRandomQuote);
    showRandomQuote();
  </script>
</body>
</html>
